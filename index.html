<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lumen" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Lumen</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('lumen.settings.v1'))?.theme
        const colors = { light: '#ffffff', dark: '#212121', mono: '#ffffff', cream: '#faf7f0' }
        if (Object.hasOwn(colors, theme)) {
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').content = colors[theme]
        }
      } catch {}
    </script>
  </head>
  <body>
    <div class="status-bar-background" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
